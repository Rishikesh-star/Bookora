name: books_read
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_pdfview: ^1.4.4
  path_provider: ^2.1.5
  http: ^1.6.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/



flutter_native_splash:
  color: "#050B18"
  image: assets/img.png
  fullscreen: true

  android_12:
    color: "#050B18"
    image: assets/img.png

    icon_background_color: "#050B18"
